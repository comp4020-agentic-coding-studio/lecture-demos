<!doctype html>
<html lang="en-AU">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Crit 1 checklist</title>
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%2334b34a' stroke='white' stroke-width='3'/%3E%3Cpath d='M18 33 L27 42 L46 21' fill='none' stroke='white' stroke-width='7' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header>
      <nav aria-label="Primary">
        <a href="./">Home</a>
      </nav>
    </header>
    <main>
      <div class="title-row">
        <svg
          class="badge"
          viewBox="0 0 64 64"
          width="56"
          height="56"
          aria-hidden="true"
        >
          <defs>
            <linearGradient id="orb" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#f2ffb8" />
              <stop offset="45%" stop-color="#8de06a" />
              <stop offset="55%" stop-color="#2fae4a" />
              <stop offset="100%" stop-color="#0b7a33" />
            </linearGradient>
            <radialGradient id="glare" cx="35%" cy="20%" r="60%">
              <stop offset="0%" stop-color="white" stop-opacity="0.95" />
              <stop offset="100%" stop-color="white" stop-opacity="0" />
            </radialGradient>
          </defs>
          <circle
            cx="32"
            cy="32"
            r="30"
            fill="url(#orb)"
            stroke="white"
            stroke-width="2"
          />
          <circle cx="32" cy="32" r="30" fill="url(#glare)" />
          <path
            d="M18 33 L27 42 L46 21"
            fill="none"
            stroke="white"
            stroke-width="6"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>
        <h1>Crit 1 checklist</h1>
      </div>
      <p>At a glance, before you freeze the prototype:</p>
      <ul class="checklist">
        <li>
          <label
            ><input type="checkbox" /> Live at its public GitHub Pages URL by
            the cutoff</label
          >
        </li>
        <li>
          <label
            ><input type="checkbox" /> A real site — a handful of pages, each
            reachable from the home page</label
          >
        </li>
        <li>
          <label
            ><input type="checkbox" /> The look commits to a web era the
            modern web has forgotten</label
          >
        </li>
        <li>
          <label
            ><input type="checkbox" /> Plain HTML and CSS — no
            JavaScript</label
          >
        </li>
        <li>
          <label
            ><input type="checkbox" /> The starter's invariant checks
            pass</label
          >
        </li>
        <li>
          <label
            ><input type="checkbox" /> Commits show the process, plus
            PROCESS.md and reflections/crit-1.md</label
          >
        </li>
        <li>
          <label
            ><input type="checkbox" /> You can explain how you directed,
            grounded and corrected the agent</label
          >
        </li>
      </ul>
    </main>
  </body>
</html>
